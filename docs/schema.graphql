type User {
  _id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  displayName: String!
  avatarUrl: String
  role: UserRole!
  status: UserStatus!
  preferredLocale: Locale!
  lastLoginAt: DateTime
  deletedAt: DateTime
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

enum UserRole {
  USER
  CREATOR
  ADMIN
}

enum UserStatus {
  ACTIVE
  SUSPENDED
  DELETED
}

enum Locale {
  ko
  en
}

type AuthPayload {
  accessToken: String!
  refreshToken: String!
  expiresIn: Int!
  user: User!
}

type AuthIdentity {
  _id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  userId: ID!
  provider: AuthProvider!
  providerSubject: String!
  verifiedAt: DateTime
  revokedAt: DateTime
  lastLoginAt: DateTime
}

enum AuthProvider {
  EMAIL
  PHONE
  GOOGLE
  TELEGRAM
  KAKAO
}

type Category {
  _id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  slug: String!
  name: String!
  description: String
  sortOrder: Int!
  isActive: Boolean!
}

type CreatorIdentity {
  displayName: String!
  avatarUrl: String
}

type SocialLink {
  label: String!
  url: String!
}

type CreatorProfile {
  _id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  userId: ID!
  slug: String!
  headline: String
  bio: String
  city: String
  remoteAvailable: Boolean!
  availability: CreatorAvailability!
  categoryIds: [ID!]!
  skills: [String!]!
  socialLinks: [SocialLink!]!
  status: ProfileStatus!
  publishedAt: DateTime
  deletedAt: DateTime
  identity: CreatorIdentity!
}

enum CreatorAvailability {
  AVAILABLE
  BUSY
  UNAVAILABLE
}

enum ProfileStatus {
  DRAFT
  PUBLISHED
  HIDDEN
}

type City {
  key: String!
  nameEn: String!
  nameKo: String!
}

type PortfolioMedia {
  type: MediaType!
  url: String!
  altText: String!
  sortOrder: Int!
}

enum MediaType {
  IMAGE
  VIDEO
}

type PortfolioProject {
  _id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  creatorId: ID!
  categoryId: ID
  title: String!
  slug: String!
  summary: String
  description: String
  coverImageUrl: String
  media: [PortfolioMedia!]!
  tags: [String!]!
  externalUrl: String
  status: ProjectStatus!
  publishedAt: DateTime
  deletedAt: DateTime
}

enum ProjectStatus {
  DRAFT
  PUBLISHED
  ARCHIVED
}

type CreatorService {
  _id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  creatorId: ID!
  categoryId: ID
  title: String!
  description: String
  pricingType: PricingType!
  startingPrice: Int
  currency: Currency!
  estimatedDays: Int
  deliverables: [String!]!
  status: ServiceStatus!
  deletedAt: DateTime
}

enum PricingType {
  STARTING_AT
  CUSTOM_QUOTE
}

enum Currency {
  KRW
}

enum ServiceStatus {
  DRAFT
  ACTIVE
  PAUSED
  ARCHIVED
}

type DiscoveryResult {
  mode: String!
  explanation: String!
  creators: [CreatorProfile!]!
  projects: [PortfolioProject!]!
  services: [CreatorService!]!
}

type SavedProjectResult {
  projectId: ID!
  savedAt: DateTime!
  available: Boolean!
  project: PortfolioProject
}

type CreatorFollow {
  _id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  followerId: ID!
  creatorId: ID!
  isActive: Boolean!
  followedAt: DateTime!
}

type ProjectComment {
  _id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  clientCommentKey: String!
  userId: ID!
  projectId: ID!
  content: String!
  status: CommentStatus!
  editedAt: DateTime
  deletedAt: DateTime
}

enum CommentStatus {
  ACTIVE
  HIDDEN
  DELETED
}

type InquiryServiceSnapshot {
  title: String!
  pricingType: PricingType!
  startingPrice: Int
  currency: Currency!
  estimatedDays: Int
  deliverables: [String!]!
}

type Inquiry {
  _id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  clientId: ID!
  creatorId: ID!
  serviceId: ID
  subject: String
  brief: String
  budgetMin: Int
  budgetMax: Int
  currency: Currency!
  desiredDeadline: DateTime
  serviceSnapshot: InquiryServiceSnapshot
  status: InquiryStatus!
  outcome: InquiryOutcome
  closedById: ID
  closedAt: DateTime
  submittedAt: DateTime
  lastMessageAt: DateTime
  version: Int!
}

enum InquiryStatus {
  DRAFT
  SENT
  IN_DISCUSSION
  DECLINED
  CLOSED
  CANCELLED
}

enum InquiryOutcome {
  AGREED_TO_PROCEED
  NOT_PROCEEDING
  NO_RESPONSE
}

type InquiryEvent {
  _id: ID!
  createdAt: DateTime!
  inquiryId: ID!
  performedById: ID!
  type: InquiryEventType!
  fromStatus: InquiryStatus!
  toStatus: InquiryStatus!
  messageId: ID
  version: Int!
}

enum InquiryEventType {
  SUBMITTED
  MESSAGE_SENT
  DECLINED
  CLOSED
  CANCELLED
}

type InquiryMessage {
  _id: ID!
  createdAt: DateTime!
  inquiryId: ID!
  senderId: ID!
  clientMessageKey: String!
  body: String!
  readAt: DateTime
}

type ActivityEvent {
  _id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  performedById: ID!
  creatorId: ID!
  type: ActivityEventType!
  projectId: ID
  commentId: ID
}

enum ActivityEventType {
  PROJECT_PUBLISHED
  PROJECT_LIKED
  PROJECT_COMMENTED
  CREATOR_FOLLOWED
}

type NotificationResult {
  _id: ID!
  createdAt: DateTime!
  recipientId: ID!
  inquiryEventId: ID
  activityEventId: ID
  readAt: DateTime
  event: InquiryEvent
  activityEvent: ActivityEvent
  unavailable: Boolean!
}

type Query {
  apiName: String!
  getMyAuthIdentities: [AuthIdentity!]!
  categories: [Category!]!
  adminCategories: [Category!]!
  creator(slug: String!): CreatorProfile!
  myCreatorProfile: CreatorProfile!
  getCities: [City!]!
  getCreators(input: DiscoveryInput! = {}): [CreatorProfile!]!
  getProjects(input: DiscoveryInput! = {}): [PortfolioProject!]!
  getServices(input: DiscoveryInput! = {}): [CreatorService!]!
  discoverCreators(input: AssistantInput!): DiscoveryResult!
  getMyFollows(input: PageInput! = {}): [CreatorFollow!]!
  getSavedProjects(input: PageInput! = {}): [SavedProjectResult!]!
  getProjectComments(projectId: ID!, input: PageInput! = {}): [ProjectComment!]!
  getProjectLikeCount(projectId: ID!): Int!
  getInquiry(inquiryId: ID!): Inquiry!
  getInquiries(creatorInbox: Boolean! = false, input: PageInput! = {}): [Inquiry!]!
  getInquiryMessages(inquiryId: ID!, input: PageInput! = {}): [InquiryMessage!]!
  getInquiryEvents(inquiryId: ID!, input: PageInput! = {}): [InquiryEvent!]!
  getNotifications(input: PageInput! = {}, unreadOnly: Boolean! = false): [NotificationResult!]!
  getUnreadNotificationCount: Int!
  getProject(projectId: ID!): PortfolioProject!
  getMyProjects(input: PageInput! = {}): [PortfolioProject!]!
  getService(serviceId: ID!): CreatorService!
  getMyServices(input: PageInput! = {}): [CreatorService!]!
  me: User!
}

input DiscoveryInput {
  creatorId: ID
  categoryId: ID
  city: String
  remoteAvailable: Boolean
  query: String
  budgetMax: Int
  offset: Int
  limit: Int
}

input AssistantInput {
  request: String!
}

input PageInput {
  offset: Int
  limit: Int
}

type Mutation {
  register(input: RegisterInput!): AuthPayload!
  registerPhone(input: PhoneRegisterInput!): AuthPayload!
  loginPhone(input: PhoneLoginInput!): AuthPayload!
  beginSocialLogin(provider: AuthProvider!): String!
  loginSocial(input: SocialLoginInput!): AuthPayload!
  login(input: LoginInput!): AuthPayload!
  refreshSession(refreshToken: String!): AuthPayload!
  verifyEmail(token: String!): Boolean!
  requestEmailVerification(input: EmailInput!): Boolean!
  requestPasswordReset(input: EmailInput!): Boolean!
  resetPassword(input: ResetPasswordInput!): Boolean!
  linkEmail(input: LinkEmailInput!): AuthIdentity!
  linkPhone(input: LinkPhoneInput!): AuthIdentity!
  beginSocialLink(provider: AuthProvider!): String!
  linkSocial(input: SocialLoginInput!): AuthIdentity!
  unlinkAuthIdentity(authIdentityId: ID!): Boolean!
  changePhonePassword(input: ChangePhonePasswordInput!): Boolean!
  logout: Boolean!
  createCategory(input: CategoryInput!): Category!
  updateCategory(id: ID!, input: UpdateCategoryInput!): Category!
  createCreatorProfile(input: CreateCreatorInput!): CreatorProfile!
  updateCreatorProfile(input: UpdateCreatorInput!): CreatorProfile!
  setCreatorProfileStatus(status: ProfileStatus!): CreatorProfile!
  deleteCreatorProfile: Boolean!
  setCreatorFollow(creatorId: ID!, following: Boolean!): Boolean!
  setProjectLike(projectId: ID!, liked: Boolean!): Boolean!
  setProjectSaved(projectId: ID!, saved: Boolean!): Boolean!
  createProjectComment(input: CommentInput!): ProjectComment!
  editProjectComment(commentId: ID!, input: EditCommentInput!): ProjectComment!
  deleteProjectComment(commentId: ID!): Boolean!
  moderateProjectComment(commentId: ID!, hidden: Boolean!): ProjectComment!
  createInquiry(input: CreateInquiryInput!): Inquiry!
  updateInquiry(input: UpdateInquiryInput!): Inquiry!
  deleteInquiryDraft(input: InquiryVersionInput!): Boolean!
  submitInquiry(input: InquiryVersionInput!): Inquiry!
  sendInquiryMessage(input: SendMessageInput!): InquiryMessage!
  markInquiryMessageRead(messageId: ID!): Boolean!
  declineInquiry(input: InquiryVersionInput!): Inquiry!
  cancelInquiry(input: InquiryVersionInput!): Inquiry!
  closeInquiry(input: CloseInquiryInput!): Inquiry!
  markNotificationRead(notificationId: ID!): Boolean!
  createProject(input: CreateProjectInput!): PortfolioProject!
  updateProject(projectId: ID!, input: UpdateProjectInput!): PortfolioProject!
  setProjectStatus(projectId: ID!, status: ProjectStatus!): PortfolioProject!
  deleteProject(projectId: ID!): Boolean!
  createService(input: CreateServiceInput!): CreatorService!
  updateService(serviceId: ID!, input: UpdateServiceInput!): CreatorService!
  setServiceStatus(serviceId: ID!, status: ServiceStatus!): CreatorService!
  deleteService(serviceId: ID!): Boolean!
  updateMe(input: UpdateUserInput!): User!
  deleteMyAccount: Boolean!
  setAccountSuspended(userId: ID!, suspended: Boolean!): User!
}

input RegisterInput {
  email: String!
  password: String!
  displayName: String!
  preferredLocale: Locale
}

input PhoneRegisterInput {
  phoneNumber: String!
  password: String!
  displayName: String!
  preferredLocale: Locale
}

input PhoneLoginInput {
  phoneNumber: String!
  password: String!
}

input SocialLoginInput {
  provider: AuthProvider!
  idToken: String!
  nonce: String!
  displayName: String
  preferredLocale: Locale
}

input LoginInput {
  email: String!
  password: String!
}

input EmailInput {
  email: String!
}

input ResetPasswordInput {
  token: String!
  password: String!
}

input LinkEmailInput {
  email: String!
  password: String!
}

input LinkPhoneInput {
  phoneNumber: String!
  password: String!
}

input ChangePhonePasswordInput {
  password: String!
}

input CategoryInput {
  slug: String!
  name: String!
  description: String
  sortOrder: Int
  isActive: Boolean
}

input UpdateCategoryInput {
  slug: String
  name: String
  description: String
  sortOrder: Int
  isActive: Boolean
}

input CreateCreatorInput {
  slug: String!
  headline: String
  bio: String
  city: String
  remoteAvailable: Boolean
  availability: CreatorAvailability
  categoryIds: [ID!]
  skills: [String!]
  socialLinks: [SocialLinkInput!]
}

input SocialLinkInput {
  label: String!
  url: String!
}

input UpdateCreatorInput {
  slug: String
  headline: String
  bio: String
  city: String
  remoteAvailable: Boolean
  availability: CreatorAvailability
  categoryIds: [ID!]
  skills: [String!]
  socialLinks: [SocialLinkInput!]
}

input CommentInput {
  clientCommentKey: String!
  projectId: ID!
  content: String!
}

input EditCommentInput {
  content: String!
}

input CreateInquiryInput {
  serviceId: ID
  subject: String
  brief: String
  budgetMin: Int
  budgetMax: Int
  desiredDeadline: DateTime
  creatorId: ID!
}

input UpdateInquiryInput {
  serviceId: ID
  subject: String
  brief: String
  budgetMin: Int
  budgetMax: Int
  desiredDeadline: DateTime
  inquiryId: ID!
  expectedVersion: Int!
  clearService: Boolean
}

input InquiryVersionInput {
  inquiryId: ID!
  expectedVersion: Int!
}

input SendMessageInput {
  inquiryId: ID!
  expectedVersion: Int!
  clientMessageKey: String!
  body: String!
}

input CloseInquiryInput {
  inquiryId: ID!
  expectedVersion: Int!
  outcome: InquiryOutcome!
}

input CreateProjectInput {
  title: String!
  slug: String!
  categoryId: ID
  summary: String
  description: String
  coverImageUrl: String
  media: [PortfolioMediaInput!]
  tags: [String!]
  externalUrl: String
}

input PortfolioMediaInput {
  type: MediaType!
  url: String!
  altText: String!
  sortOrder: Int!
}

input UpdateProjectInput {
  title: String
  slug: String
  categoryId: ID
  summary: String
  description: String
  coverImageUrl: String
  media: [PortfolioMediaInput!]
  tags: [String!]
  externalUrl: String
}

input CreateServiceInput {
  title: String!
  categoryId: ID
  description: String
  pricingType: PricingType
  startingPrice: Int
  estimatedDays: Int
  deliverables: [String!]
}

input UpdateServiceInput {
  title: String
  categoryId: ID
  description: String
  pricingType: PricingType
  startingPrice: Int
  estimatedDays: Int
  deliverables: [String!]
}

input UpdateUserInput {
  displayName: String
  avatarUrl: String
  preferredLocale: Locale
}
