# Enable only after the CreatorHub certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name creatorhub.site www.creatorhub.site api.creatorhub.site;
    location ^~ /.well-known/acme-challenge/ { root /srv/Sean/creatorhub/shared/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.creatorhub.site;
    ssl_certificate /etc/letsencrypt/live/creatorhub.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/creatorhub.site/privkey.pem;
    return 301 https://creatorhub.site$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name creatorhub.site;
    ssl_certificate /etc/letsencrypt/live/creatorhub.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/creatorhub.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 105m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    access_log /var/log/nginx/creatorhub-7007.access.log;
    error_log /var/log/nginx/creatorhub-7007.error.log;
    location / {
        proxy_pass http://127.0.0.1:7007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.creatorhub.site;
    ssl_certificate /etc/letsencrypt/live/creatorhub.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/creatorhub.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 105m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    access_log /var/log/nginx/creatorhub-7001.access.log;
    error_log /var/log/nginx/creatorhub-7001.error.log;
    location / {
        proxy_pass http://127.0.0.1:7001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location /socket.io/ {
        proxy_pass http://127.0.0.1:7001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
    }
}
