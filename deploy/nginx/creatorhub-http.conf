# Install as a NEW /etc/nginx/sites-available/creatorhub file.
# HTTP bootstrap for the site's own ACME challenge only. No default_server.
server {
    listen 80;
    listen [::]:80;
    server_name creatorhub.site www.creatorhub.site api.creatorhub.site;
    location ^~ /.well-known/acme-challenge/ {
        root /srv/Sean/creatorhub/shared/acme;
    }
    location / { return 503; }
}
